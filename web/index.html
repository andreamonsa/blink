<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <!-- KaTeX renders the LaTeX that speech-to-text / summarizer.py emit. If it
       fails to load (offline), formulas simply stay as raw text. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="frame">
    <!-- Left: live transcript on ruled paper -->
    <section class="transcript-col" aria-labelledby="transcript-title">
      <header class="transcript-head">
        <div>
          <p class="kicker">Blink · Lecture notes · <span class="today"></span></p>
          <h1 id="transcript-title">Real time transcript</h1>
        </div>
        <div class="pills">
          <label id="name-pill" class="pill name-pill" title="Blink alerts you when this name is said. Add nicknames with commas.">
            <svg class="name-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <span class="sr-only">Your name</span>
            <input id="student-name" type="text" placeholder="Your name" autocomplete="given-name" spellcheck="false" size="9">
          </label>
          <span id="live-pill" class="pill">Paused</span>
          <span id="gaze-pill" class="pill">Eye tracker…</span>
        </div>
      </header>

      <div class="paper">
        <div id="transcript" class="transcript" role="log" aria-live="off" tabindex="0">
          <p id="transcript-empty" class="empty">Press <strong>start</strong> to begin live captions.</p>
        </div>
        <button id="jump-live" class="jump-live" hidden>Back to live ↓</button>
        <!-- "Someone said your name" notification (attention.js) -->
        <section id="attention-notice" class="attention-notice" role="alert" hidden>
          <div class="notice-head">
            <span class="notice-dot" aria-hidden="true"></span>
            <strong>Someone said your name</strong>
            <time class="notice-time"></time>
            <button class="notice-close" aria-label="Dismiss">✕</button>
          </div>
          <p class="notice-quote"></p>
          <button class="notice-jump">Show in transcript</button>
          <div class="notice-timer" aria-hidden="true"></div>
        </section>
      </div>

      <footer class="controls">
        <button id="btn-start" class="btn btn-ink" aria-pressed="false">start</button>
        <button id="btn-summary" class="btn btn-outline">summary</button>
        <p id="hint" class="hint"></p>
      </footer>
    </section>

    <!-- Right: catch-up card + history -->
    <aside class="side-col" aria-label="Catch up">
      <section id="catchup-current" class="catchup-card" aria-live="polite"></section>
      <section class="past" aria-labelledby="past-title">
        <h2 id="past-title" class="past-title" hidden>Past catch ups</h2>
        <div id="past-list" class="past-list"></div>
      </section>
    </aside>
  </main>

  <!-- "Someone said your name": screen-edge glow (attention.js) -->
  <div id="attention-glow" class="attention-glow" aria-hidden="true">
    <div class="glow-bloom"><div class="glow-band"></div></div>
    <div class="glow-band glow-edge"></div>
  </div>

  <script>
    document.querySelectorAll(".today").forEach((el) => {
      el.textContent = new Date().toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
    });
  </script>
  <script src="mock-lecture.js"></script>
  <script src="sources.js"></script>
  <script src="attention.js"></script> <!-- before app.js so it hears the first gaze state -->
  <script src="app.js"></script>
  <script src="ruled.js"></script>
</body>
</html>
